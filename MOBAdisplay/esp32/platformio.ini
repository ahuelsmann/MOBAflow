; Minimum supported module: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM). See MOBAdisplay/docs/notes.md.

[env:esp32s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf

; Must match kDiagnosticSerialBaud (115200) in esp32/src/main.cpp for boot/diagnostic serial.
monitor_speed = 115200

; Octal PSRAM (8 MB on N16R8).
board_build.flash_mode = qio

; Must match CONFIG_ESPTOOLPY_FLASHSIZE_16MB in sdkconfig.defaults.
board_upload.flash_size = 16MB

; 4 MB factory app partition; nvs keeps its offset so provisioned Wi-Fi credentials survive.
board_build.partitions = partitions.csv

board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

build_flags =
    -DBOARD_HAS_PSRAM
    ; Firmware version text shown on the display splash (independent from .NET MinVer).
    -DAPP_VERSION=\"v0.1-dev\"
    ; Optional: set WLAN from CLI without editing main.cpp
    ; -DWIFI_SSID=\"YOUR_SSID\"
    ; -DWIFI_PASSWORD=\"YOUR_PASSWORD\"

[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_udp_packet_parser
    test_provisioning
    test_display_core
    test_display_protocol
lib_extra_dirs = lib
build_flags =
    -std=gnu++11
    -Isrc

