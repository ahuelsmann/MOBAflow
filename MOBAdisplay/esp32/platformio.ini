; Match Flash + PSRAM to the module label on the metal (e.g. WROOM-1 N8R8 = 8 MB Flash + 8 MB Octal PSRAM).
; If PSRAM still shows 0 in the serial log, try the QUAD 2 MB block below (NxR2 modules) or fix flash_size/partitions.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Must match kDiagnosticSerialBaud (115200) in esp32/src/main.cpp for boot/diagnostic serial.
monitor_speed = 115200

lib_extra_dirs = lib

; --- Octal PSRAM (typical 8 MB on-chip PSRAM, e.g. N4R8 / N8R8 / N16R8) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; Flash size: set to your module (4 MB / 8 MB / 16 MB). Wrong size can break PSRAM init on some setups.
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    ; Firmware version text shown on the display splash (independent from .NET MinVer).
    -DAPP_VERSION=\"v0.1-dev\"
    ; Optional: set WLAN from CLI without editing main.cpp
    ; -DWIFI_SSID=\"YOUR_SSID\"
    ; -DWIFI_PASSWORD=\"YOUR_PASSWORD\"

; --- Alternative: 2 MB Quad PSRAM (e.g. WROOM N4R2 / N8R2 / N16R2) — comment OCTAL block above and use: ---
; board_build.arduino.memory_type = qio_qspi
; board_build.flash_mode = qio
; board_build.psram_type = qio
; board_upload.flash_size = 4MB

[env:native]
platform = native
test_framework = unity
test_filter = test_udp_packet_parser
build_flags =
    -std=gnu++11
    -fsanitize=address
    -fsanitize=undefined
    -fno-omit-frame-pointer

