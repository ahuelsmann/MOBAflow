# Azure DevOps Pipeline: MOBAflow Release
# - Version wird über MinVer aus Git-Tags ermittelt
# - CHANGELOG wird über git-cliff aus Conventional Commits generiert/aktualisiert
#
# WICHTIG:
# - Diese Pipeline hat keinen automatischen Trigger.
# - Sie sollte nur bewusst für Releases gestartet werden.

trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  dotnetVersion: '10.0.x'

stages:
  - stage: Release
    displayName: 'MOBAflow Release'
    jobs:
      - job: BuildAndChangelog
        displayName: 'Determine Version (MinVer) + Update CHANGELOG.md'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0   # vollständige Git-History für MinVer & Conventional Changelog

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: PowerShell@2
            displayName: 'Install & run git-cliff + determine version via MinVer'
            inputs:
              targetType: 'inline'
              script: |
                # Install MinVer CLI
                dotnet tool install --global minver-cli --version 7.*
                $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
                $version = minver
                Write-Host "Detected version (MinVer): $version"
                Write-Host "##vso[task.setvariable variable=MobaflowVersion]$version"

                # Install git-cliff via Chocolatey (pre-installed on windows-latest agents)
                choco install git-cliff -y --no-progress
                $env:PATH += ";C:\ProgramData\chocolatey\bin"

                # Generate/Update CHANGELOG.md
                cd "$(Build.SourcesDirectory)"
                if (Test-Path CHANGELOG.md) {
                  Write-Host "Updating CHANGELOG.md using git-cliff..."
                  git-cliff -o CHANGELOG.md
                } else {
                  Write-Host "CHANGELOG.md not found, creating new file..."
                  git-cliff -o CHANGELOG.md
                }
                Write-Host "CHANGELOG updated successfully."
              pwsh: true

          # HINWEIS:
          # - An dieser Stelle können Build/Publish-Schritte für Release-Artefakte folgen.
          # - Commit/Tagging sollte nur in einer separaten, bewusst konfigurierten Pipeline/Stage erfolgen.

