# Azure DevOps Pipeline: PR Validation (Build + Tests + Coverage)
# Nutzt .NET 10, dotnet-coverage und SonarQube Cloud für statische Codeanalyse.
# MAUI bleibt explizit außen vor (dieses Quality Gate prüft nur MOBAflow Desktop und Tests).

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

variables:
  buildPlatform: 'x64'
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

  # SonarQube Cloud configuration (see SonarCloudPrepare inputs in Sonar docs)
  # sonarServiceConnection must match the service connection name in Project Settings > Service connections.
  sonarOrganization: 'ahuelsmann'
  sonarProjectKey: 'ahuelsmann_MOBAflow'
  sonarProjectName: 'MOBAflow'
  sonarProjectVersion: '1.0'
  sonarServiceConnection: 'SonarQubeAnalyze'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Quality
    displayName: 'PR Quality Gate: Build, Tests, Coverage'
    jobs:
      - job: BuildTestAnalyze
        displayName: 'Build projects and run tests with dotnet-coverage'
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: SonarCloudPrepare@4
            displayName: 'Prepare SonarQube Cloud Analysis'
            inputs:
              SonarCloud: '$(sonarServiceConnection)'
              organization: '$(sonarOrganization)'
              scannerMode: 'dotnet'
              projectKey: '$(sonarProjectKey)'
              projectName: '$(sonarProjectName)'
              projectVersion: '$(sonarProjectVersion)'
              extraProperties: |
                sonar.exclusions=**/obj/**

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages (MOBAflow + Test)'
            inputs:
              command: 'restore'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              feedsToUse: 'select'

          - task: DotNetCoreCLI@2
            displayName: 'Build Projects (MOBAflow + Test)'
            inputs:
              command: 'build'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: SonarCloudAnalyze@4
            displayName: 'Run SonarQube Cloud Analysis'

          - task: SonarCloudPublish@4
            displayName: 'Publish SonarQube Cloud Quality Gate Result'
            inputs:
              pollingTimeoutSec: '300'
              
          - task: DotNetCoreCLI@2
            displayName: 'Install dotnet-coverage'
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: 'install --global dotnet-coverage'

          - script: |
              cd "$(Build.SourcesDirectory)"
              dotnet-coverage collect ^
                -s Test/dotnet-coverage.runsettings ^
                -f cobertura ^
                -o "$(Agent.TempDirectory)/coverage.cobertura.xml" ^
                "dotnet test Test/Test.csproj --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults"
            displayName: 'Run Tests with dotnet-coverage (Cobertura)'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Unit Tests (dotnet-coverage)'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage (Cobertura)'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/coverage.cobertura.xml'
              reportDirectory: '$(Agent.TempDirectory)/coverage-report'