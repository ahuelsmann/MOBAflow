# Azure DevOps Pipeline: PR Validation (Build + Tests + Coverage)
# Nutzt .NET 10 und dotnet-coverage. SonarQube-Schritte sind aktuell auskommentiert.
# MAUI bleibt explizit außen vor (dieses Quality Gate prüft nur MOBAflow Desktop und Tests).

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

variables:
  buildPlatform: 'x64'
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

  # Sonar-Konfiguration – aktuell deaktiviert (nur für spätere Aktivierung)
  #sonarProjectKey: 'mobaflow'
  #sonarProjectName: 'MOBAflow'
  #sonarProjectVersion: '1.0'
  #sonarServiceConnection: 'SonarQubeServiceConnection'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Quality
    displayName: 'PR Quality Gate: Build, Tests, Coverage'
    jobs:
      - job: BuildTestAnalyze
        displayName: 'Build projects and run tests with dotnet-coverage'
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 1
            clean: true

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages (MOBAflow + Test)'
            inputs:
              command: 'restore'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              feedsToUse: 'select'

          - task: DotNetCoreCLI@2
            displayName: 'Build Projects (MOBAflow + Test)'
            inputs:
              command: 'build'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Install dotnet-coverage'
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: 'install --global dotnet-coverage'

          - script: |
              cd "$(Build.SourcesDirectory)"
              dotnet-coverage collect ^
                -s Test/dotnet-coverage.runsettings ^
                -f cobertura ^
                -o "$(Agent.TempDirectory)/coverage.cobertura.xml" ^
                "dotnet test Test/Test.csproj --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults"
            displayName: 'Run Tests with dotnet-coverage (Cobertura)'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Unit Tests (dotnet-coverage)'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage (Cobertura)'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/coverage.cobertura.xml'
              reportDirectory: '$(Agent.TempDirectory)/coverage-report'

          # - task: SonarQubeAnalyze@5
          #   displayName: 'Run SonarQube Analysis'

          # - task: SonarQubePublish@5
          #   displayName: 'Publish SonarQube Quality Gate Result'
          #   inputs:
          #     pollingTimeoutSec: '300'

