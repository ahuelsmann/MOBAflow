# Azure DevOps Pipeline: PR Validation (Build + Tests + Coverage)
# Nutzt .NET 10, Coverlet-MSBuild und SonarQube Cloud für statische Codeanalyse.
# MAUI bleibt explizit außen vor (dieses Quality Gate prüft nur MOBAflow Desktop und Tests).

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

variables:
  buildPlatform: 'x64'
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  nugetPackages: '$(Pipeline.Workspace)/.nuget/packages'

  # SonarQube Cloud configuration (see SonarCloudPrepare inputs in Sonar docs)
  # sonarServiceConnection must match the service connection name in Project Settings > Service connections.
  sonarOrganization: 'ahuelsmann'
  sonarProjectKey: 'ahuelsmann_MOBAflow'
  sonarProjectName: 'MOBAflow'
  sonarProjectVersion: '1.0'
  sonarServiceConnection: 'SonarQubeAnalyze'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Quality
    displayName: 'PR Quality Gate: Build, Tests, Coverage'
    jobs:
      - job: BuildTestAnalyze
        displayName: 'Build projects and run tests with Coverlet'
        timeoutInMinutes: 60

        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: Cache@2
            displayName: 'Cache NuGet packages'
            inputs:
              key: 'nuget | "$(Agent.OS)" | Directory.Packages.props | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)" | Directory.Packages.props
                nuget | "$(Agent.OS)"
              path: '$(nugetPackages)'

          - task: SonarCloudPrepare@4
            displayName: 'Prepare SonarQube Cloud Analysis'
            inputs:
              SonarCloud: '$(sonarServiceConnection)'
              organization: '$(sonarOrganization)'
              scannerMode: 'dotnet'
              projectKey: '$(sonarProjectKey)'
              projectName: '$(sonarProjectName)'
              projectVersion: '$(sonarProjectVersion)'
              extraProperties: |
                sonar.exclusions=**/obj/**

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages (MOBAflow + Test)'
            inputs:
              command: 'restore'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              feedsToUse: 'select'
              arguments: '-p:IncludeMobaSmartTests=false'
            env:
              NUGET_PACKAGES: '$(nugetPackages)'

          - task: DotNetCoreCLI@2
            displayName: 'Build Projects (MOBAflow + Test)'
            inputs:
              command: 'build'
              projects: |
                **/MOBAflow.csproj
                **/Test.csproj
              arguments: '--configuration $(buildConfiguration) --no-restore -p:IncludeMobaSmartTests=false -p:DebugType=portable -p:DebugSymbols=true'
            env:
              NUGET_PACKAGES: '$(nugetPackages)'

          - task: SonarCloudAnalyze@4
            displayName: 'Run SonarQube Cloud Analysis'

          - task: SonarCloudPublish@4
            displayName: 'Publish SonarQube Cloud Quality Gate Result'
            inputs:
              pollingTimeoutSec: '300'
              
          - powershell: |
              $coveragePath = "$(Agent.TempDirectory)\coverage.cobertura.xml"
              dotnet test Test/Test.csproj `
                --configuration $(buildConfiguration) `
                --framework net10.0-windows10.0.22621.0 `
                --no-build `
                -p:IncludeMobaSmartTests=false `
                -p:DebugType=portable `
                -p:DebugSymbols=true `
                --logger trx `
                --collect:"XPlat Code Coverage" `
                --settings Test/coverlet.runsettings `
                --results-directory "$(Agent.TempDirectory)\TestResults"
              $testExitCode = $LASTEXITCODE

              $generatedCoverage = Get-ChildItem "$(Agent.TempDirectory)\TestResults" -Recurse -Filter coverage.cobertura.xml |
                Select-Object -First 1
              if (-not $generatedCoverage) {
                throw 'Coverlet did not produce a Cobertura report.'
              }
              Copy-Item $generatedCoverage.FullName $coveragePath -Force

              [xml]$coverage = Get-Content $coveragePath
              if ([int64]$coverage.coverage.'lines-valid' -le 0) {
                throw 'Cobertura report contains no instrumented lines.'
              }

              exit $testExitCode
            displayName: 'Run Tests with Coverlet collector (Cobertura)'
            env:
              NUGET_PACKAGES: '$(nugetPackages)'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Unit Tests (Coverlet)'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage (Cobertura)'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/coverage.cobertura.xml'
              reportDirectory: '$(Agent.TempDirectory)/coverage-report'

          - task: PublishPipelineArtifact@1
            displayName: 'Archive Cobertura coverage source'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Agent.TempDirectory)/coverage.cobertura.xml'
              artifact: 'coverage-cobertura'
              publishLocation: 'pipeline'
