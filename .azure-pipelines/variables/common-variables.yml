# Azure DevOps Pipelines - Shared Variables
# Used across all pipeline templates

variables:
  # .NET Configuration
  dotnetVersion: '10.0.x'
  buildConfiguration: 'Release'
  buildPlatform: 'x64'
  
  # Solution paths
  solution: 'Moba.slnx'
  testProject: 'Test/Test.csproj'
  
  # WinUI specific
  winuiProject: 'MOBAflow/MOBAflow.csproj'
  
  # MAUI specific  
  mauiProject: 'MOBAsmart/MOBAsmart.csproj'
  
  # REST API specific
  apiProject: 'MOBApi/MOBApi.csproj'
