# Shared project settings. Personal authentication and plugins stay outside the repository.
# Native file/search/web tools operate in the active worktree; no filesystem MCP is needed.
sandbox_mode = "workspace-write"

[mcp_servers.sonarqube]
command = "sonar"
args = ["run", "mcp", "--project", "ahuelsmann_MOBAflow2"]

[sandbox_workspace_write]
network_access = true
