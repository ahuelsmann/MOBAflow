name: Release Studio

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed SemVer tag (for example 0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-draft:
    name: Validate, package, and draft release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Release Studio only builds the Windows desktop/test surface.
      ANDROID_SDK_ROOT: ""
      ANDROID_HOME: ""

    steps:
      - name: Check out trusted release validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-workflow
          sparse-checkout: scripts/Validate-ReleaseTag.ps1
          sparse-checkout-cone-mode: false

      - name: Stage trusted release validator
        shell: pwsh
        run: Copy-Item trusted-workflow/scripts/Validate-ReleaseTag.ps1 "$env:RUNNER_TEMP/Validate-ReleaseTag.ps1"

      - name: Check out the requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Validate signed release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          & "$env:RUNNER_TEMP/Validate-ReleaseTag.ps1"
          -Tag $env:RELEASE_TAG
          -Repository '${{ github.repository }}'
          -Token $env:GH_TOKEN

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore release projects
        shell: pwsh
        run: |
          dotnet restore MOBAflow/MOBAflow.csproj --runtime win-x64
          dotnet restore Test/Test.csproj

      - name: Build MOBAflow
        shell: pwsh
        run: >-
          dotnet build MOBAflow/MOBAflow.csproj
          --configuration Release
          --no-restore

      - name: Run tests
        shell: pwsh
        run: >-
          dotnet test Test/Test.csproj
          --configuration Release
          --no-restore
          --logger trx
          --results-directory artifacts/TestResults

      - name: Publish MOBAflow
        shell: pwsh
        run: >-
          dotnet publish MOBAflow/MOBAflow.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/MOBAflow-win-x64

      - name: Publish bundled MOBApi
        shell: pwsh
        run: >-
          dotnet publish MOBApi/MOBApi.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/MOBAflow-win-x64/MOBApi

      - name: Sanitize release configuration
        shell: pwsh
        run: |
          $settingsPath = 'artifacts/MOBAflow-win-x64/appsettings.json'
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $settings.Z21.CurrentIpAddress = ''
          $settings.Speech.PiperExecutablePath = ''
          $settings.Speech.PiperModelPath = ''
          $settings.Speech.PiperConfigPath = ''
          $settings.Application.LastSolutionPath = $null
          $settings.Application.PhotoStoragePath = ''
          $settings | ConvertTo-Json -Depth 20 | Set-Content $settingsPath -Encoding utf8NoBOM

      - name: Validate published release content
        shell: pwsh
        run: >-
          ./scripts/Test-ReleasePackage.ps1
          -PublishDirectory artifacts/MOBAflow-win-x64

      - name: Package artifacts and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $archive = "artifacts/MOBAflow-$tag-win-x64.zip"
          Compress-Archive -Path artifacts/MOBAflow-win-x64/* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item CHANGELOG.md artifacts/RELEASE-NOTES.md

      - name: Validate archive and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          ./scripts/Test-ReleasePackage.ps1
          -PublishDirectory artifacts/MOBAflow-win-x64
          -Archive "artifacts/MOBAflow-$env:RELEASE_TAG-win-x64.zip"
          -ChecksumFile artifacts/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MOBAflow-${{ inputs.tag }}-release-candidate
          path: |
            artifacts/MOBAflow-${{ inputs.tag }}-win-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/TestResults/**/*.trx
            artifacts/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            "artifacts/MOBAflow-$tag-win-x64.zip",
            "artifacts/SHA256SUMS.txt"
          )

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            $release = gh release view $tag --repo '${{ github.repository }}' --json isDraft | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $tag is already published. Release Studio will not modify it."
            }

            gh release upload $tag @assets --clobber --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw "Could not update draft release assets." }
            gh release edit $tag --notes-file artifacts/RELEASE-NOTES.md --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw "Could not update draft release notes." }
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--draft',
              '--verify-tag',
              '--notes-file', 'artifacts/RELEASE-NOTES.md',
              '--title', "MOBAflow $tag",
              '--repo', '${{ github.repository }}'
            )
            if ($env:RELEASE_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
            $arguments += $assets
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release." }
          }
