name: Test review gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: review-gate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-gate-tests:
    name: Test review gate script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run review gate self-tests
        shell: pwsh
        run: ./scripts/Test-ReviewGate.Tests.ps1
