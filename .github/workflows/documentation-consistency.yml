name: Documentation consistency

# Only base-branch control code executes. PR files are read as data, never imported or run.
# The default checkout is the base branch; a PR head is fetched as data only for an enabled,
# trusted same-repository PR. Fork and untrusted heads never reach this privileged runner.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: documentation-consistency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assess:
    name: Assess documentation changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.assess.outputs.publish }}
    steps:
      - name: Check out trusted controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controls
          persist-credentials: false
      - name: Check out subject as data
        if: >-
          vars.DOCS_AI_ENABLED == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secrets scanner
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Assess and independently verify
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_AI_ENABLED: ${{ vars.DOCS_AI_ENABLED }}
          DOCS_AI_MODEL: ${{ vars.DOCS_AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python3 controls/scripts/run_documentation_consistency.py assess
          --root subject --control controls --result result/result.json
      - name: Preserve assessment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-assessment-${{ github.run_id }}
          path: result/result.json
          if-no-files-found: error
          retention-days: 7

  publish-and-report:
    name: Publish documentation result
    needs: assess
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out trusted controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controls
          persist-credentials: false
      - name: Load verified assessment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: documentation-assessment-${{ github.run_id }}
          path: result
      - name: Check out assessed head for publication
        if: >-
          needs.assess.outputs.publish == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified publication scanner
        if: needs.assess.outputs.publish == 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create repository-scoped writer token
        if: >-
          needs.assess.outputs.publish == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        id: writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Publish bounded documentation commit
        if: needs.assess.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_WRITE_TOKEN: ${{ steps.writer.outputs.token }}
        run: >-
          python3 controls/scripts/run_documentation_consistency.py publish
          --root subject --control controls --result result/result.json
      - name: Report on the exact assessed PR head
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 controls/scripts/run_documentation_consistency.py report
          --root subject --control controls --result result/result.json
