name: Independent final review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-gate-publisher-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Evaluate independent final review gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      # Security boundary: check out ONLY the trusted default branch ('main'); PR code is never executed, installed, or sourced.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Evaluate final review gate and publish commit status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $prNumber = [int] $env:PR_NUMBER
          $repository = $env:REPOSITORY

          if (-not (Test-Path -LiteralPath 'scripts/Test-ReviewGate.ps1' -PathType Leaf)) {
            Write-Host "::notice::scripts/Test-ReviewGate.ps1 is not yet installed on default branch; skipping status publication."
            exit 0
          }

          # Fetch PR head git objects strictly for diff comparison; PR files are never checked out or executed.
          git fetch origin "pull/${prNumber}/head"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch pull/${prNumber}/head."
          }

          ./scripts/Test-ReviewGate.ps1 -PullRequest $prNumber -Repository $repository -SetStatus
