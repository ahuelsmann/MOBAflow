name: Independent final review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-gate-publisher-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Evaluate independent final review gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      # Security boundary: clone ONLY the trusted default branch; PR code is never executed, installed, or sourced.
      - name: Evaluate final review gate and publish commit status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $prNumber = [int] $env:PR_NUMBER
          $repository = $env:REPOSITORY
          $defaultBranch = $env:DEFAULT_BRANCH
          $repoDir = Join-Path $env:RUNNER_TEMP 'review-gate-repo'
          if (Test-Path -LiteralPath $repoDir) {
            Remove-Item -LiteralPath $repoDir -Recurse -Force
          }

          git clone --branch $defaultBranch -- "https://github.com/$repository.git" $repoDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone $defaultBranch from $repository."
          }

          Set-Location $repoDir

          if (-not (Test-Path -LiteralPath 'scripts/Test-ReviewGate.ps1' -PathType Leaf)) {
            Write-Host "::notice::scripts/Test-ReviewGate.ps1 is not yet installed on default branch; skipping status publication."
            exit 0
          }

          # Fetch PR head git objects strictly for diff comparison; PR files are never checked out or executed.
          git fetch origin "pull/${prNumber}/head"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch pull/${prNumber}/head."
          }

          ./scripts/Test-ReviewGate.ps1 -PullRequest $prNumber -Repository $repository -SetStatus
