name: Independent final review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Evaluate independent final review gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Evaluate final review gate and publish commit status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $prNumber = [int] $env:PR_NUMBER
          $repository = $env:REPOSITORY

          if (-not (Test-Path -LiteralPath 'scripts/Test-ReviewGate.ps1' -PathType Leaf)) {
            $headSha = (gh api "repos/$repository/pulls/$prNumber" --jq .head.sha).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($headSha)) {
              throw "Failed to resolve head SHA for PR #$prNumber."
            }

            $statusArgs = @('api', "repos/$repository/statuses/$headSha", '-f', 'state=success', '-f', 'context=Independent final review', '-f', 'description=gate not yet installed')
            gh @statusArgs | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to post bootstrap review gate status for PR #$prNumber."
            }
            exit 0
          }

          git fetch origin "pull/${prNumber}/head"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch pull/${prNumber}/head."
          }

          ./scripts/Test-ReviewGate.ps1 -PullRequest $prNumber -Repository $repository -SetStatus

  review-gate-tests:
    name: Test review gate script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run review gate self-tests
        shell: pwsh
        run: ./scripts/Test-ReviewGate.Tests.ps1
