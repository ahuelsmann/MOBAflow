name: Documentation links

# External sites fail independently of our changes, so their links are checked weekly and on demand
# instead of on every pull request. Internal links and images are checked in the Quality workflow.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: Check external documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check internal and external documentation links
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1 -IncludeExternal
