name: Deploy MOBAdemo

on:
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel an in-flight slotless F1 zip deployment mid-upload (FR-055).
  group: deploy-mobademo
  cancel-in-progress: false

jobs:
  package:
    name: Audit, test, and package MOBAdemo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.archive.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: MOBAdemo/app/.nvmrc
          cache: npm
          cache-dependency-path: MOBAdemo/app/package-lock.json

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # FR-074: audit the committed lockfile before installing any package.
      - name: Audit npm dependencies
        shell: pwsh
        working-directory: MOBAdemo/app
        run: |
          $report = $null
          $severities = 'critical', 'high', 'moderate', 'low', 'info'
          foreach ($attempt in 1..2) {
            $raw = npm audit --package-lock-only --include=prod --include=dev --audit-level=high --registry https://registry.npmjs.org/ --json 2>$null | Out-String
            try { $candidate = $raw | ConvertFrom-Json } catch { $candidate = $null }
            $valid = $null -ne $candidate -and
              $null -eq $candidate.PSObject.Properties['error'] -and
              $candidate.PSObject.Properties['auditReportVersion'] -and $candidate.auditReportVersion -eq 2 -and
              $candidate.PSObject.Properties['metadata'] -and $candidate.metadata.PSObject.Properties['vulnerabilities'] -and
              $candidate.PSObject.Properties['vulnerabilities']
            if ($valid) {
              foreach ($severity in $severities) {
                $count = $candidate.metadata.vulnerabilities.PSObject.Properties[$severity]
                if ($null -eq $count -or (($count.Value -isnot [int]) -and ($count.Value -isnot [long])) -or $count.Value -lt 0) { $valid = $false }
              }
            }
            if ($valid) {
              $entries = @($candidate.vulnerabilities.PSObject.Properties)
              foreach ($severity in $severities) {
                $listed = @($entries | Where-Object { $_.Value.severity -eq $severity }).Count
                if ($listed -ne $candidate.metadata.vulnerabilities.PSObject.Properties[$severity].Value) { $valid = $false }
              }
            }
            if ($valid) {
              $report = $candidate
              break
            }
            Write-Host "Attempt ${attempt}: no valid audit report."
            if ($attempt -lt 2) { Start-Sleep -Seconds 10 }
          }
          if ($null -eq $report) {
            Write-Host '::error title=npm audit::No valid audit report; the registry or the audit endpoint did not answer.'
            exit 1
          }
          $counts = $report.metadata.vulnerabilities
          Write-Host "Vulnerabilities: critical=$($counts.critical) high=$($counts.high) moderate=$($counts.moderate) low=$($counts.low) info=$($counts.info)"
          if (([int] $counts.critical + [int] $counts.high) -gt 0) {
            Write-Host '::error title=npm audit::Known high or critical vulnerabilities in the lockfile (FR-074).'
            exit 1
          }
          exit 0

      - name: Install, lint, and test frontend
        working-directory: MOBAdemo/app
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test

      - name: Build the MOBAdemo web root and check bundle budget
        shell: pwsh
        run: |
          ./MOBAdemo/build.ps1 -Configuration Release
          ./MOBAdemo/Test-BundleBudget.ps1 -Path MOBAdemo/Host/wwwroot-build

      - name: Publish MOBAdemo host and package zip archive
        id: archive
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $artifactName = "mobademo-package-$($env:RUN_ID)-$($env:RUN_ATTEMPT)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifact_name=$artifactName" -Encoding utf8NoBOM

          $publishDir = Join-Path $env:RUNNER_TEMP 'mobademo-publish'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'mobademo-artifact'
          $zipPath = Join-Path $artifactDir 'mobademo.zip'
          foreach ($dir in @($publishDir, $artifactDir)) {
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          dotnet publish MOBAdemo/Host/MOBAdemo.csproj --configuration Release --output $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $indexHtmlPath = Join-Path $publishDir 'wwwroot/index.html'
          if (-not (Test-Path -LiteralPath $indexHtmlPath -PathType Leaf)) {
            throw 'Published output is missing wwwroot/index.html.'
          }
          $indexHtml = Get-Content -LiteralPath $indexHtmlPath -Raw
          if ($indexHtml -notmatch '<div id="root"></div>') {
            throw 'Published wwwroot/index.html is the placeholder rather than the built React app.'
          }

          # Write an opaque per-package revision marker (no host/path metadata per FR-030) so post-deploy polling
          # proves the newly uploaded archive is live even when frontend asset hashes are unchanged.
          $revisionToken = [Guid]::NewGuid().ToString('N')
          $revisionFilePath = Join-Path $publishDir "wwwroot/assets/revision-$revisionToken.txt"
          [IO.File]::WriteAllText($revisionFilePath, $revisionToken, [Text.UTF8Encoding]::new($false))

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $publishRoot = [IO.Path]::TrimEndingDirectorySeparator([IO.Path]::GetFullPath($publishDir))
          $stream = [IO.File]::Open($zipPath, [IO.FileMode]::Create, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
          try {
            $archive = [IO.Compression.ZipArchive]::new($stream, [IO.Compression.ZipArchiveMode]::Create, $false)
            try {
              foreach ($file in Get-ChildItem -LiteralPath $publishRoot -Recurse -File -Force) {
                if ($file.Name -eq '.mobademo-webroot') { continue }
                $entryName = [IO.Path]::GetRelativePath($publishRoot, $file.FullName).Replace('\', '/')
                [void] [IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $archive,
                  $file.FullName,
                  $entryName,
                  [IO.Compression.CompressionLevel]::Optimal)
              }
            }
            finally {
              $archive.Dispose()
            }
          }
          finally {
            $stream.Dispose()
          }
          Write-Host "Created deployment archive: $zipPath ($((Get-Item -LiteralPath $zipPath).Length) bytes, revision $revisionToken)"

      - name: Upload MOBAdemo deployment package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ runner.temp }}/mobademo-artifact/mobademo.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy and verify MOBAdemo on Azure
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: none
      id-token: write
    environment:
      name: mobademo
      url: https://mobaflow-demo.azurewebsites.net/

    steps:
      - name: Download MOBAdemo deployment package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/mobademo-artifact

      - name: Extract expected revision hashes and asset paths from archive
        id: expected
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path $env:RUNNER_TEMP 'mobademo-artifact/mobademo.zip'
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Downloaded deployment archive not found at '$zipPath'."
          }

          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $indexEntry = $archive.GetEntry('wwwroot/index.html')
            if ($null -eq $indexEntry) {
              throw 'mobademo.zip does not contain wwwroot/index.html.'
            }
            $ms = [IO.MemoryStream]::new()
            try {
              $entryStream = $indexEntry.Open()
              try { $entryStream.CopyTo($ms) } finally { $entryStream.Dispose() }
              $indexBytes = $ms.ToArray()
            }
            finally {
              $ms.Dispose()
            }

            $sha256 = [Security.Cryptography.SHA256]::HashData($indexBytes)
            $indexHash = ([BitConverter]::ToString($sha256) -replace '-', '').ToLowerInvariant()
            $indexHtml = [Text.Encoding]::UTF8.GetString($indexBytes)
            if ($indexHtml -notmatch '<div id="root"></div>') {
              throw 'wwwroot/index.html inside mobademo.zip does not contain <div id="root"></div>.'
            }

            $jsPaths = @([regex]::Matches($indexHtml, 'src="(/assets/[^"]+\.js)"') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
            $cssPaths = @([regex]::Matches($indexHtml, 'href="(/assets/[^"]+\.css)"') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
            if ($jsPaths.Count -eq 0 -or $cssPaths.Count -eq 0) {
              throw "Expected hashed /assets/*.js and /assets/*.css references in wwwroot/index.html; found js=$($jsPaths.Count), css=$($cssPaths.Count)."
            }
            foreach ($assetPath in ($jsPaths + $cssPaths)) {
              $zipEntryPath = 'wwwroot' + $assetPath
              if ($null -eq $archive.GetEntry($zipEntryPath)) {
                throw "Referenced asset '$zipEntryPath' is missing from mobademo.zip."
              }
            }

            $revisionEntries = @($archive.Entries | Where-Object { $_.FullName -match '^wwwroot/assets/revision-([0-9a-f]{32})\.txt$' })
            if ($revisionEntries.Count -ne 1) {
              throw "Expected exactly one wwwroot/assets/revision-<32hex>.txt entry in mobademo.zip; found $($revisionEntries.Count)."
            }
            $revisionEntry = $revisionEntries[0]
            $expectedTokenFromName = [regex]::Match($revisionEntry.FullName, '^wwwroot/assets/revision-([0-9a-f]{32})\.txt$').Groups[1].Value
            $revReader = [IO.StreamReader]::new($revisionEntry.Open(), [Text.Encoding]::UTF8)
            try {
              $revisionBody = $revReader.ReadToEnd().Trim()
            }
            finally {
              $revReader.Dispose()
            }
            if ($revisionBody -ne $expectedTokenFromName) {
              throw 'Revision marker body in mobademo.zip does not match its filename token.'
            }
            $revisionPath = '/assets/revision-' + $revisionBody + '.txt'
          }
          finally {
            $archive.Dispose()
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP 'mobademo-expected.json'
          @{
            indexSha256   = $indexHash
            revisionPath  = $revisionPath
            revisionToken = $revisionBody
            assets        = @($jsPaths + $cssPaths)
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          Write-Host "Expected index.html SHA-256: $indexHash"
          Write-Host "Expected package revision probe: $revisionPath"
          Write-Host "Expected hashed assets: $(($jsPaths + $cssPaths) -join ', ')"

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Shared Free-tier (F1) Linux workers do not populate OneDeploy's dedicated instance-health tracker
      # (--track-status true times out after 10 min even when Kudu finishes in ~6 s and the site starts in ~14 s);
      # the next step verifies live HTTPS activation of the exact newly deployed revision.
      - name: Deploy MOBAdemo to Azure App Service
        shell: pwsh
        run: |
          az webapp deploy `
            --resource-group rg-mobaflow-demo `
            --name mobaflow-demo `
            --src-path "$env:RUNNER_TEMP/mobademo-artifact/mobademo.zip" `
            --type zip `
            --clean true `
            --track-status false
          if ($LASTEXITCODE -ne 0) {
            throw "az webapp deploy failed with exit code $LASTEXITCODE."
          }

      - name: Verify live MOBAdemo revision and endpoints
        shell: pwsh
        run: |
          $baseUrl = 'https://mobaflow-demo.azurewebsites.net'
          $expected = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mobademo-expected.json') -Raw | ConvertFrom-Json
          $expectedHash = [string] $expected.indexSha256
          $expectedRevisionPath = [string] $expected.revisionPath
          $expectedRevisionToken = [string] $expected.revisionToken
          $expectedAssets = @($expected.assets | ForEach-Object { [string] $_ })

          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AutomaticDecompression = [Net.DecompressionMethods]::Brotli -bor [Net.DecompressionMethods]::GZip
          $client = [Net.Http.HttpClient]::new($handler)
          $client.Timeout = [TimeSpan]::FromSeconds(15)

          try {
            $activated = $false
            $liveRootResponse = $null
            for ($attempt = 1; $attempt -le 24; $attempt++) {
              try {
                $health = Invoke-WebRequest -Uri "$baseUrl/health" -Method Get -Headers @{ 'Cache-Control' = 'no-cache' } -TimeoutSec 15 -SkipHttpErrorCheck
                $revResp = Invoke-WebRequest -Uri "$baseUrl$expectedRevisionPath" -Method Get -Headers @{ 'Cache-Control' = 'no-cache' } -TimeoutSec 15 -SkipHttpErrorCheck
                if ($health.StatusCode -eq 200 -and
                    $health.Content.Trim() -eq 'ok' -and
                    $revResp.StatusCode -eq 200 -and
                    $revResp.Content.Trim() -eq $expectedRevisionToken) {
                  $req = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get, "$baseUrl/")
                  $req.Headers.TryAddWithoutValidation('Accept-Encoding', 'br, gzip') | Out-Null
                  $req.Headers.TryAddWithoutValidation('Cache-Control', 'no-cache') | Out-Null
                  $resp = $client.SendAsync($req).GetAwaiter().GetResult()
                  if ([int] $resp.StatusCode -eq 200) {
                    $liveBytes = $resp.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                    $liveHash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData($liveBytes)) -replace '-', '').ToLowerInvariant()
                    $liveHtml = [Text.Encoding]::UTF8.GetString($liveBytes)
                    $allAssetsReferenced = $true
                    foreach ($assetPath in $expectedAssets) {
                      if (-not $liveHtml.Contains($assetPath, [StringComparison]::Ordinal)) {
                        $allAssetsReferenced = $false
                        break
                      }
                    }
                    if ($liveHash -eq $expectedHash -and $allAssetsReferenced) {
                      $activated = $true
                      $liveRootResponse = $resp
                      break
                    }
                    Write-Host "Attempt ${attempt}: / served SHA-256 $liveHash (waiting for $expectedHash)."
                  }
                  else {
                    Write-Host "Attempt ${attempt}: / returned HTTP $([int] $resp.StatusCode)."
                  }
                }
                else {
                  Write-Host "Attempt ${attempt}: /health=$($health.StatusCode), $expectedRevisionPath=$($revResp.StatusCode) (waiting for new package activation)."
                }
              }
              catch {
                Write-Host "Attempt ${attempt}: live check failed ($($_.Exception.Message))."
              }
              if ($attempt -lt 24) { Start-Sleep -Seconds 5 }
            }

            if (-not $activated -or $null -eq $liveRootResponse) {
              throw "Newly deployed MOBAdemo package ($expectedRevisionPath, index.html SHA-256 $expectedHash) did not become active at $baseUrl/ within timeout (if HTTP 403, check Azure Portal Quotas on mobaflow-demo per FR-075)."
            }

            $csp = if ($liveRootResponse.Headers.Contains('Content-Security-Policy')) { $liveRootResponse.Headers.GetValues('Content-Security-Policy') -join '; ' } else { '' }
            if ($csp -notmatch "style-src 'self'") {
              throw "Missing expected Content-Security-Policy style-src 'self' header on $baseUrl/."
            }
            $nosniff = if ($liveRootResponse.Headers.Contains('X-Content-Type-Options')) { $liveRootResponse.Headers.GetValues('X-Content-Type-Options') -join ', ' } else { '' }
            if ($nosniff -ne 'nosniff') {
              throw "Missing X-Content-Type-Options: nosniff on $baseUrl/."
            }

            foreach ($assetPath in $expectedAssets) {
              $assetUrl = "$baseUrl$assetPath"
              $assetResp = Invoke-WebRequest -Uri $assetUrl -Method Get -Headers @{ 'Accept-Encoding' = 'br, gzip' } -TimeoutSec 15 -SkipHttpErrorCheck
              if ($assetResp.StatusCode -ne 200) {
                throw "Expected HTTP 200 from live asset $assetUrl, got $($assetResp.StatusCode)."
              }
              $assetCache = [string] $assetResp.Headers['Cache-Control']
              if ($assetCache -notmatch 'immutable') {
                throw "Expected immutable Cache-Control on hashed asset $assetUrl, got '$assetCache'."
              }
              Write-Host "Verified live asset 200 OK: $assetPath ($assetCache)"
            }

            $runtimeProbe = Invoke-WebRequest -Uri "$baseUrl/api/runtime" -Method Get -TimeoutSec 15 -SkipHttpErrorCheck
            if ($runtimeProbe.StatusCode -ne 404) {
              throw "Expected HTTP 404 from $baseUrl/api/runtime (FR-002), got $($runtimeProbe.StatusCode)."
            }
            Write-Host "Live smoke checks passed for revision $expectedHash at $baseUrl/."
          }
          finally {
            $client.Dispose()
            $handler.Dispose()
          }
