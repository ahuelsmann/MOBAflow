name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validate_android:
        description: 'Validate the pinned Android toolchain and Release AAB'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Pull requests cancel superseded runs on the same branch. Main pushes and manual dispatches each get a
  # run-specific group so an intermediate main push (and its scoped jobs) is never dropped before validation.
  group: quality-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only pushes to main and pull requests skip the build, test and firmware jobs. Changes that touch
  # neither the ESP32 firmware nor a given mutation lane's transitive inputs skip those parts, and only pushes/pull
  # requests that change MOBAsmart or its analyzer baseline run the Android Release AAB job;
  # scripts/Get-QualityChangeScope.ps1 owns the path rules. GitHub reports a job skipped by its condition as
  # successful. Job conditions read every output with != 'false', so a detection failure (empty outputs) or a push
  # with an unreachable/unknown before commit runs every scoped job, Android included. Manual workflow_dispatch runs
  # without validate_android run every job except Android.
  # The MOBAdemo job runs for MOBAdemo, its tests and the shared build inputs, and for unknown paths.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      firmware: ${{ steps.scope.outputs.firmware }}
      mutation: ${{ steps.scope.outputs.mutation }}
      mutation_common: ${{ steps.scope.outputs.mutation_common }}
      mutation_contracts: ${{ steps.scope.outputs.mutation_contracts }}
      mutation_speech_base: ${{ steps.scope.outputs.mutation_speech_base }}
      mutation_backend: ${{ steps.scope.outputs.mutation_backend }}
      mutation_api: ${{ steps.scope.outputs.mutation_api }}
      mutation_shared_ui: ${{ steps.scope.outputs.mutation_shared_ui }}
      mutation_track_plan_renderer: ${{ steps.scope.outputs.mutation_track_plan_renderer }}
      android: ${{ steps.scope.outputs.android }}
      mobademo: ${{ steps.scope.outputs.mobademo }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            # The pull-request checkout is the merge commit; its first parent is the base branch.
            ./scripts/Get-QualityChangeScope.ps1 -BaseRef 'HEAD^1' -HeadRef HEAD | Out-Null
            exit 0
          }

          if ($env:EVENT_NAME -eq 'push' -and
              $env:EVENT_BEFORE -match '^[0-9a-f]{40}$' -and
              $env:EVENT_BEFORE -ne ('0' * 40)) {
            git cat-file -e "$($env:EVENT_BEFORE)^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              ./scripts/Get-QualityChangeScope.ps1 -BaseRef $env:EVENT_BEFORE -HeadRef $env:EVENT_SHA | Out-Null
              exit 0
            }
          }

          $fallbackAndroid = if ($env:EVENT_NAME -eq 'workflow_dispatch') { 'false' } else { 'true' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(
            'code=true', 'firmware=true', 'mutation=true',
            'mutation_common=true', 'mutation_contracts=true', 'mutation_speech_base=true',
            'mutation_backend=true', 'mutation_api=true', 'mutation_shared_ui=true',
            'mutation_track_plan_renderer=true', "android=$fallbackAndroid", 'mobademo=true'
          ) -Encoding utf8NoBOM

  instruction-consistency:
    name: Repository instruction consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository instructions
        shell: pwsh
        run: ./scripts/Test-InstructionConsistency.ps1

      # Pinned release binary verified by its SHA-256; it also runs shellcheck on bash steps.
      - name: Lint GitHub workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # External links are checked on a schedule (documentation-links.yml) so that a foreign server
      # outage cannot block a pull request.
      - name: Check internal documentation links and images
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1

      - name: Test documentation link check
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.Tests.ps1

      - name: Validate AI repository setup
        run: python3 scripts/Test-AiRepositorySetup.py

      - name: Check generated documentation facts
        run: python3 scripts/documentation_consistency.py

      - name: Test documentation consistency boundaries
        run: python3 scripts/Test-DocumentationConsistency.py

      - name: Test AI repository setup helpers
        run: python3 scripts/Test-AiRepositorySetup.Tests.py

      - name: Validate line endings
        shell: pwsh
        run: ./scripts/Test-LineEndings.ps1

      - name: Test line-ending guard
        shell: pwsh
        run: ./scripts/Test-LineEndings.Tests.ps1

      - name: Test release SBOM scripts
        shell: pwsh
        run: ./scripts/Test-ReleaseSbom.Tests.ps1

      - name: Test Quality change scope classification
        shell: pwsh
        run: ./scripts/Get-QualityChangeScope.Tests.ps1

      - name: Test test-result guard
        shell: pwsh
        run: ./scripts/Test-TestRunResults.Tests.ps1

  desktop:
    name: Windows desktop build, tests, and coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test mutation inclusion and execution guards
        shell: pwsh
        run: ./scripts/Test-MutationGuards.Tests.ps1

      - name: Validate mutation lane registry and effective test host inputs
        shell: pwsh
        run: ./scripts/Test-MutationLaneCoverage.ps1

      - name: Test analyzer baseline guard
        shell: pwsh
        run: ./scripts/Test-AnalyzerBaseline.Tests.ps1

      - name: Restore desktop test graph
        shell: pwsh
        run: dotnet restore Test/Test.csproj

      - name: Build cross-platform analyzer graph
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts/analyzers) {
            Remove-Item -LiteralPath artifacts/analyzers -Recurse -Force
          }
          dotnet build Test/Test.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            -m:1 `
            -t:Rebuild `
            -p:MobaAnalyzerGate=true `
            -p:UseSharedCompilation=false
          ./scripts/Test-AnalyzerBaseline.ps1 `
            -SarifRoot artifacts/analyzers/Release/net10.0 `
            -BaselinePath quality/analyzer-baseline.json `
            -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.json

      - name: Build desktop test graph
        shell: pwsh
        run: >-
          dotnet build Test/Test.csproj
          --configuration Release
          --framework net10.0-windows10.0.22621.0
          --no-restore
          -p:DebugType=portable
          -p:DebugSymbols=true
          -p:MobaAnalyzerGate=true
          -p:UseSharedCompilation=false

      - name: Enforce Windows analyzer baseline
        shell: pwsh
        run: >-
          ./scripts/Test-AnalyzerBaseline.ps1
          -SarifRoot artifacts/analyzers/Release/net10.0-windows10.0.22621.0
          -BaselinePath quality/analyzer-baseline.windows.json
          -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.windows.json

      # Written only when the sole mismatch is fixed diagnostics; copy it over the file in quality/ after review.
      - name: Archive refreshed analyzer baselines
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-analyzer-baselines-desktop-${{ github.run_number }}
          path: artifacts/refreshed-baselines/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit resolved NuGet dependency graph
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet list Test/Test.csproj package `
            --framework net10.0-windows10.0.22621.0 `
            --include-transitive `
            --vulnerable `
            --format json `
            --output-version 1 `
            --no-restore | Set-Content artifacts/nuget-vulnerabilities.json -Encoding utf8NoBOM

      - name: Run desktop tests with Cobertura coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $coveragePath = Join-Path (Resolve-Path artifacts) 'coverage.cobertura.xml'

          dotnet test Test/Test.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.22621.0 `
            --no-build `
            -p:DebugType=portable `
            -p:DebugSymbols=true `
            --logger trx `
            --collect:"XPlat Code Coverage" `
            --settings Test/coverlet.runsettings `
            --results-directory artifacts/TestResults
          $testExitCode = $LASTEXITCODE

          $generatedCoverage = Get-ChildItem artifacts/TestResults -Recurse -Filter coverage.cobertura.xml |
            Select-Object -First 1
          if (-not $generatedCoverage) {
            throw 'Coverlet did not produce a Cobertura report.'
          }
          Copy-Item $generatedCoverage.FullName $coveragePath -Force

          [xml]$coverage = Get-Content $coveragePath
          if ([int64]$coverage.coverage.'lines-valid' -le 0) {
            throw 'Cobertura report contains no instrumented lines.'
          }

          exit $testExitCode

      - name: Enforce coverage ratchet
        shell: pwsh
        run: >-
          ./scripts/Test-CoverageThresholds.ps1
          -CoveragePath artifacts/coverage.cobertura.xml

      - name: Add measured coverage to job summary
        if: always()
        shell: pwsh
        run: |
          $coveragePath = 'artifacts/coverage.cobertura.xml'
          if (-not (Test-Path $coveragePath)) {
            '## Coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
            'No valid Cobertura report was produced.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          [xml]$coverage = Get-Content $coveragePath
          $lineRate = [double]::Parse(
            $coverage.coverage.'line-rate',
            [Globalization.CultureInfo]::InvariantCulture)
          $percentage = ($lineRate * 100).ToString('F2', [Globalization.CultureInfo]::InvariantCulture)
          '## Coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
          "Measured line coverage: **$percentage%**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Instrumented lines: $($coverage.coverage.'lines-valid')" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Commit: ${{ github.sha }}" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Archive test results and Cobertura report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-quality-${{ github.run_number }}
          path: |
            artifacts/TestResults/**/*.trx
            artifacts/coverage.cobertura.xml
            artifacts/nuget-vulnerabilities.json
            artifacts/analyzers/**/*.sarif
          if-no-files-found: warn
          retention-days: 90

  mutation-common:
    name: Common mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_common != 'false' }}
    # Existing Common fixtures also cover Windows-specific stored photo paths.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and Common mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Common/Common.MutationTests.csproj

      - name: Run Common mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName common -OutputPath artifacts/mutation/common

      - name: Archive Common mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: common-mutation-${{ github.run_number }}
          path: artifacts/mutation/common/**
          if-no-files-found: warn
          retention-days: 90

  mutation-speech-base:
    name: Speech.Base mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_speech_base != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and Speech.Base mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Speech.Base/Speech.Base.MutationTests.csproj

      - name: Run Speech.Base mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName speech-base -OutputPath artifacts/mutation/speech-base

      - name: Archive Speech.Base mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-base-mutation-${{ github.run_number }}
          path: artifacts/mutation/speech-base/**
          if-no-files-found: warn
          retention-days: 90

  mutation-contracts:
    name: Contracts mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_contracts != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and Contracts mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Contracts/Contracts.MutationTests.csproj

      - name: Run Contracts mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName contracts -OutputPath artifacts/mutation/contracts

      - name: Archive Contracts mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-mutation-${{ github.run_number }}
          path: artifacts/mutation/contracts/**
          if-no-files-found: warn
          retention-days: 90

  mutation-backend:
    name: Backend mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_backend != 'false' }}
    # A local run with four Stryker processes takes about 35 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
