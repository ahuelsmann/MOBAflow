name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests skip the build, test and firmware jobs. Pull requests that touch neither
  # the ESP32 firmware nor the Domain mutation graph skip those parts; scripts/Get-QualityChangeScope.ps1
  # owns the path rules. GitHub reports a job skipped by its condition as successful, so the required checks
  # stay satisfied. Any detection failure, unknown path or non-PR event keeps the full workflow.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      firmware: ${{ steps.scope.outputs.firmware }}
      mutation: ${{ steps.scope.outputs.mutation }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: scope
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ne 'pull_request') {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'code=true', 'firmware=true', 'mutation=true' -Encoding utf8NoBOM
            exit 0
          }

          # The pull-request checkout is the merge commit; its first parent is the base branch.
          ./scripts/Get-QualityChangeScope.ps1 -BaseRef 'HEAD^1' -HeadRef HEAD | Out-Null

  instruction-consistency:
    name: Repository instruction consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository instructions
        shell: pwsh
        run: ./scripts/Test-InstructionConsistency.ps1

      # Pinned release binary verified by its SHA-256; it also runs shellcheck on bash steps.
      - name: Lint GitHub workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # External links are checked on a schedule (documentation-links.yml) so that a foreign server
      # outage cannot block a pull request.
      - name: Check internal documentation links and images
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1

      - name: Test documentation link check
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.Tests.ps1

      - name: Validate AI repository setup
        run: python3 scripts/Test-AiRepositorySetup.py

      - name: Test AI repository setup helpers
        run: python3 scripts/Test-AiRepositorySetup.Tests.py

      - name: Validate line endings
        shell: pwsh
        run: ./scripts/Test-LineEndings.ps1

      - name: Test line-ending guard
        shell: pwsh
        run: ./scripts/Test-LineEndings.Tests.ps1

      - name: Test Quality change scope classification
        shell: pwsh
        run: ./scripts/Get-QualityChangeScope.Tests.ps1

  desktop:
    name: Windows desktop build, tests, and coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate mutation test lane registry
        shell: pwsh
        run: ./scripts/Test-MutationLaneCoverage.ps1

      - name: Test analyzer baseline guard
        shell: pwsh
        run: ./scripts/Test-AnalyzerBaseline.Tests.ps1

      - name: Restore desktop test graph
        shell: pwsh
        run: dotnet restore Test/Test.csproj -p:IncludeMobaSmartTests=false

      - name: Build cross-platform analyzer graph
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts/analyzers) {
            Remove-Item -LiteralPath artifacts/analyzers -Recurse -Force
          }
          dotnet build Test/Test.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            -m:1 `
            -t:Rebuild `
            -p:IncludeMobaSmartTests=false `
            -p:MobaAnalyzerGate=true `
            -p:UseSharedCompilation=false
          ./scripts/Test-AnalyzerBaseline.ps1 `
            -SarifRoot artifacts/analyzers/Release/net10.0 `
            -BaselinePath quality/analyzer-baseline.json `
            -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.json

      - name: Build desktop test graph
        shell: pwsh
        run: >-
          dotnet build Test/Test.csproj
          --configuration Release
          --framework net10.0-windows10.0.22621.0
          --no-restore
          -p:IncludeMobaSmartTests=false
          -p:DebugType=portable
          -p:DebugSymbols=true
          -p:MobaAnalyzerGate=true
          -p:UseSharedCompilation=false

      - name: Enforce Windows analyzer baseline
        shell: pwsh
        run: >-
          ./scripts/Test-AnalyzerBaseline.ps1
          -SarifRoot artifacts/analyzers/Release/net10.0-windows10.0.22621.0
          -BaselinePath quality/analyzer-baseline.windows.json
          -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.windows.json

      # Written only when the sole mismatch is fixed diagnostics; copy it over the file in quality/ after review.
      - name: Archive refreshed analyzer baselines
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-analyzer-baselines-desktop-${{ github.run_number }}
          path: artifacts/refreshed-baselines/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit resolved NuGet dependency graph
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet list Test/Test.csproj package `
            --framework net10.0-windows10.0.22621.0 `
            --include-transitive `
            --vulnerable `
            --format json `
            --output-version 1 `
            --no-restore | Set-Content artifacts/nuget-vulnerabilities.json -Encoding utf8NoBOM

      - name: Run desktop tests with Cobertura coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $coveragePath = Join-Path (Resolve-Path artifacts) 'coverage.cobertura.xml'

          dotnet test Test/Test.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.22621.0 `
            --no-build `
            -p:IncludeMobaSmartTests=false `
            -p:DebugType=portable `
            -p:DebugSymbols=true `
            --logger trx `
            --collect:"XPlat Code Coverage" `
            --settings Test/coverlet.runsettings `
            --results-directory artifacts/TestResults
          $testExitCode = $LASTEXITCODE

          $generatedCoverage = Get-ChildItem artifacts/TestResults -Recurse -Filter coverage.cobertura.xml |
            Select-Object -First 1
          if (-not $generatedCoverage) {
            throw 'Coverlet did not produce a Cobertura report.'
          }
          Copy-Item $generatedCoverage.FullName $coveragePath -Force

          [xml]$coverage = Get-Content $coveragePath
          if ([int64]$coverage.coverage.'lines-valid' -le 0) {
            throw 'Cobertura report contains no instrumented lines.'
          }

          exit $testExitCode

      - name: Enforce coverage ratchet
        shell: pwsh
        run: >-
          ./scripts/Test-CoverageThresholds.ps1
          -CoveragePath artifacts/coverage.cobertura.xml

      - name: Add measured coverage to job summary
        if: always()
        shell: pwsh
        run: |
          $coveragePath = 'artifacts/coverage.cobertura.xml'
          if (-not (Test-Path $coveragePath)) {
            '## Coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
            'No valid Cobertura report was produced.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          [xml]$coverage = Get-Content $coveragePath
          $lineRate = [double]::Parse(
            $coverage.coverage.'line-rate',
            [Globalization.CultureInfo]::InvariantCulture)
          $percentage = ($lineRate * 100).ToString('F2', [Globalization.CultureInfo]::InvariantCulture)
          '## Coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
          "Measured line coverage: **$percentage%**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Instrumented lines: $($coverage.coverage.'lines-valid')" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Commit: ${{ github.sha }}" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Archive test results and Cobertura report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-quality-${{ github.run_number }}
          path: |
            artifacts/TestResults/**/*.trx
            artifacts/coverage.cobertura.xml
            artifacts/nuget-vulnerabilities.json
            artifacts/analyzers/**/*.sarif
          if-no-files-found: warn
          retention-days: 90

  display-protocol:
    name: Display protocol host, parser, and firmware
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore display host test graph
        shell: pwsh
        run: >-
          dotnet restore Test/Test.csproj
          -p:TargetFramework=net10.0
          -p:IncludeMobaSmartTests=false

      # Skia rendering stays in the Windows desktop lane because this Linux lane owns protocol and transport only.
      - name: Run display host conformance tests
        shell: pwsh
        run: |
          $filter = @(
            'FullyQualifiedName~Moba.Test.MOBAdisplay'
            'FullyQualifiedName!~ClockRendererTests'
            'FullyQualifiedName!~FrameLoopSchedulerTests'
            'FullyQualifiedName!~Rgb565ConverterTests'
            'FullyQualifiedName!~SkiaFrameRendererTests'
          ) -join '&'
          dotnet test Test/Test.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            -p:IncludeMobaSmartTests=false `
            --filter $filter

      - name: Install pinned PlatformIO
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: |
          python3 -m pip install --user --only-binary :all: platformio==6.1.19

      - name: Run native firmware parser and protocol tests
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: python3 -m platformio test -d MOBAdisplay/esp32 -e native

      - name: Build ESP32-S3 firmware
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: python3 -m platformio run -d MOBAdisplay/esp32 -e esp32s3

      # The custom partition table is flashed separately; archive the complete bundle with its offsets.
      - name: Record ESP32-S3 flash bundle
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        working-directory: MOBAdisplay/esp32/.pio/build/esp32s3
        run: |
          printf '%s\n' '0x0 bootloader.bin' '0x8000 partitions.bin' '0x10000 firmware.bin' | tee flash-offsets.txt
          sha256sum bootloader.bin partitions.bin firmware.bin | tee flash-bundle.sha256

      - name: Archive ESP32-S3 flash bundle
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MOBAdisplay-esp32s3-${{ github.run_number }}
          path: |
            MOBAdisplay/esp32/.pio/build/esp32s3/bootloader.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/partitions.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/firmware.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/flash-offsets.txt
            MOBAdisplay/esp32/.pio/build/esp32s3/flash-bundle.sha256
          if-no-files-found: error
          retention-days: 30

  android-release:
    name: Android Release AAB
    needs: changes
    # Disabled while MOBAsmart is not distributed; retain the required check name.
    # Re-enable the code-change condition when Android release distribution starts.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An SDK in Program Files also installs every workload registered by the image's Visual Studio.
      - name: Use a job-local .NET install
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuget/packages
          key: >-
            nuget-${{ runner.os }}-android-${{ hashFiles('global.json', 'NuGet.Config',
            'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-android-

      # workload restore always moves to the newest workload set, even with --skip-manifest-update.
      # Installing the workload with an explicit set version keeps the Android toolchain reproducible.
      - name: Install pinned MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android --version 10.0.401.1

      - name: Restore Android dependency graph
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts/analyzers) {
            Remove-Item -LiteralPath artifacts/analyzers -Recurse -Force
          }
          dotnet restore MOBAsmart/MOBAsmart.csproj `
            --property:Configuration=Release `
            --force-evaluate

      - name: Verify Android build properties
        shell: pwsh
        run: |
          $properties = dotnet msbuild MOBAsmart/MOBAsmart.csproj `
            -nologo `
            -p:Configuration=Release `
            -getProperty:Platform,PlatformTarget,RuntimeIdentifiers,AndroidPackageFormats |
            ConvertFrom-Json
          if ($properties.Properties.Platform -ne 'AnyCPU') {
            throw "Expected Platform=AnyCPU; found $($properties.Properties.Platform)."
          }
          if ($properties.Properties.PlatformTarget -ne 'AnyCPU') {
            throw "Expected PlatformTarget=AnyCPU; found $($properties.Properties.PlatformTarget)."
          }
          if ($properties.Properties.RuntimeIdentifiers -ne 'android-arm64;android-x64') {
            throw "Unexpected Android RuntimeIdentifiers: $($properties.Properties.RuntimeIdentifiers)"
          }
          if ($properties.Properties.AndroidPackageFormats -ne 'aab') {
            throw "Expected AndroidPackageFormats=aab; found $($properties.Properties.AndroidPackageFormats)."
          }

      - name: Publish Android Release AAB
        shell: pwsh
        run: >-
          dotnet publish MOBAsmart/MOBAsmart.csproj
          --framework net10.0-android
          --configuration Release
          --no-restore
          -m:1
          -p:MobaAnalyzerGate=true
          -p:UseSharedCompilation=false

      - name: Enforce Android analyzer baseline
        shell: pwsh
        run: >-
          ./scripts/Test-AnalyzerBaseline.ps1
          -SarifRoot artifacts/analyzers/Release
          -BaselinePath quality/analyzer-baseline.android.json
          -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.android.json

      # Written only when the sole mismatch is fixed diagnostics; copy it over the file in quality/ after review.
      - name: Archive refreshed analyzer baselines
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-analyzer-baselines-android-${{ github.run_number }}
          path: artifacts/refreshed-baselines/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate Android Release AAB
        shell: pwsh
        run: |
          $bundleRoot = 'MOBAsmart/bin/Release/net10.0-android/publish'
          $bundles = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter *.aab)
          if ($bundles.Count -eq 0) {
            throw 'Android Release publish did not produce an AAB.'
          }
          $apks = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter *.apk)
          if ($apks.Count -ne 0) {
            throw "Android Release publish produced unexpected APK files: $($apks.Name -join ', ')"
          }
          New-Item -ItemType Directory -Force artifacts/MOBAsmart-Release | Out-Null
          foreach ($bundle in $bundles) {
            ./scripts/Test-AndroidAppBundle.ps1 -BundlePath $bundle.FullName
            Copy-Item -LiteralPath $bundle.FullName -Destination artifacts/MOBAsmart-Release
          }

      - name: Archive Android Release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MOBAsmart-android-release-${{ github.run_number }}
          path: artifacts/MOBAsmart-Release/*.aab
          if-no-files-found: error
          retention-days: 30

  mutation-domain:
    name: Domain mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore local tools and Domain mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore MutationTest/Domain.MutationTests.csproj

      - name: Run Domain mutation tests
        shell: pwsh
        working-directory: MutationTest
        run: dotnet stryker --skip-version-check

      - name: Archive Domain mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-mutation-${{ github.run_number }}
          path: MutationTest/StrykerOutput/**/reports/*
          if-no-files-found: warn
          retention-days: 90
