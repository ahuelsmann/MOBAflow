          global-json-file: global.json

      - name: Restore local tools and Backend mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Backend/Backend.MutationTests.csproj

      - name: Run Backend mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName backend -OutputPath artifacts/mutation/backend

      - name: Archive Backend mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-mutation-${{ github.run_number }}
          path: artifacts/mutation/backend/**
          if-no-files-found: warn
          retention-days: 90

  mutation-api:
    name: MOBApi mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_api != 'false' }}
    # A local run with four Stryker processes takes about two minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and MOBApi mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Api/Api.MutationTests.csproj

      - name: Run MOBApi mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName api -OutputPath artifacts/mutation/api

      - name: Archive MOBApi mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-mutation-${{ github.run_number }}
          path: artifacts/mutation/api/**
          if-no-files-found: warn
          retention-days: 90

  mutation-shared-ui:
    name: SharedUI mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_shared_ui != 'false' }}
    # A local Linux run with four Stryker processes takes about 63 minutes; the first CI run took 51 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and SharedUI mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/SharedUI/SharedUI.MutationTests.csproj

      - name: Run SharedUI mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName shared-ui -OutputPath artifacts/mutation/shared-ui

      - name: Archive SharedUI mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-ui-mutation-${{ github.run_number }}
          path: artifacts/mutation/shared-ui/**
          if-no-files-found: warn
          retention-days: 90

  mutation-track-plan-renderer:
    name: TrackPlan.Renderer mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation_track_plan_renderer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and TrackPlan.Renderer mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/TrackPlan.Renderer/TrackPlan.Renderer.MutationTests.csproj

      - name: Run TrackPlan.Renderer mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName track-plan-renderer -OutputPath artifacts/mutation/track-plan-renderer

      - name: Archive TrackPlan.Renderer mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-plan-renderer-mutation-${{ github.run_number }}
          path: artifacts/mutation/track-plan-renderer/**
          if-no-files-found: warn
          retention-days: 90

  display-protocol:
    name: Display protocol host, parser, and firmware
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore display host test graph
        shell: pwsh
        run: >-
          dotnet restore Test/Test.csproj
          -p:TargetFramework=net10.0

      # Skia rendering stays in the Windows desktop lane because this Linux lane owns protocol and transport only.
      - name: Run display host conformance tests
        shell: pwsh
        run: |
          $filter = @(
            'FullyQualifiedName~Moba.Test.MOBAdisplay'
            'FullyQualifiedName!~ClockRendererTests'
            'FullyQualifiedName!~FrameLoopSchedulerTests'
            'FullyQualifiedName!~Rgb565ConverterTests'
            'FullyQualifiedName!~SkiaFrameRendererTests'
          ) -join '&'
          dotnet test Test/Test.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            --filter $filter

      # Each fixture starts the built MOBApi as an isolated process on a free local port. The result guard
      # fails the step when a test is skipped or the filter selects too few tests.
      - name: Run MOBApi process integration tests
        shell: pwsh
        run: |
          $filter = @(
            'FullyQualifiedName~Moba.Test.Integration.MobApiProcessTests'
            'FullyQualifiedName~Moba.Test.Integration.RuntimeHubLiveE2ETests'
          ) -join '|'
          dotnet test Test/Test.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            --filter $filter `
            --logger 'trx;LogFileName=mobapi-integration.trx' `
            --results-directory artifacts/TestResults/mobapi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-TestRunResults.ps1 `
            -Path artifacts/TestResults/mobapi/mobapi-integration.trx `
            -MinimumPassed 6

      # ubuntu-latest moved to ubuntu-26.04 with CPython 3.14. PlatformIO builds its ESP-IDF environment from this
      # interpreter, and the pinned idf-component-manager pulls pydantic-core 2.33.2, which has no 3.14 wheel and
      # fails to build from source (PyO3 0.24 supports up to 3.13). Pin 3.13 so pip keeps using prebuilt wheels.
      - name: Install Python for PlatformIO
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install pinned PlatformIO
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: |
          python3 -m pip install --user --only-binary :all: platformio==6.1.19

      - name: Run native firmware parser and protocol tests
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: python3 -m platformio test -d MOBAdisplay/esp32 -e native

      - name: Build ESP32-S3 firmware
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        run: python3 -m platformio run -d MOBAdisplay/esp32 -e esp32s3

      # The custom partition table is flashed separately; archive the complete bundle with its offsets.
      - name: Record ESP32-S3 flash bundle
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        shell: bash
        working-directory: MOBAdisplay/esp32/.pio/build/esp32s3
        run: |
          printf '%s\n' '0x0 bootloader.bin' '0x8000 partitions.bin' '0x10000 firmware.bin' | tee flash-offsets.txt
          sha256sum bootloader.bin partitions.bin firmware.bin | tee flash-bundle.sha256

      - name: Archive ESP32-S3 flash bundle
        if: ${{ needs.changes.outputs.firmware != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MOBAdisplay-esp32s3-${{ github.run_number }}
          path: |
            MOBAdisplay/esp32/.pio/build/esp32s3/bootloader.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/partitions.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/firmware.bin
            MOBAdisplay/esp32/.pio/build/esp32s3/flash-offsets.txt
            MOBAdisplay/esp32/.pio/build/esp32s3/flash-bundle.sha256
          if-no-files-found: error
          retention-days: 30

  portable-linux:
    name: Portable tests on Linux
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # RF-10 gate: C# whitespace and final newlines follow .editorconfig. Folder mode needs no restore; vendored
      # firmware and the NuGet cache stay outside, as in the documented local command.
      - name: Check C# whitespace formatting
        run: dotnet format whitespace --folder . --verify-no-changes --exclude .nuget MOBAdisplay/esp32

      # AGENTS.md promises portable .NET work on Windows or Linux; this lane proves the portable suite on Linux.
      # Create_CopyFailureRemovesPartialRuntimeCopyAndPreservesSource needs Windows file locks ([Platform("Win")])
      # and runs in the Windows desktop lane; explicit maintainer-run hardware tests (category Hardware) never run in
      # CI; Skia rendering stays in the Windows desktop lane like in display-protocol (no Linux native Skia library).
      # They are excluded so the result guard can require every selected test to run.
      - name: Run portable tests
        shell: pwsh
        run: |
          $results = 'artifacts/TestResults/portable-linux'
          $filter = @(
            'TestCategory!=Hardware'
            'FullyQualifiedName!=Moba.Test.Common.MobaApiRuntimeDeploymentTests.Create_CopyFailureRemovesPartialRuntimeCopyAndPreservesSource'
            'FullyQualifiedName!~ClockRendererTests'
            'FullyQualifiedName!~Rgb565ConverterTests'
            'FullyQualifiedName!~SkiaFrameRendererTests'
          ) -join '&'
          dotnet test Test/Test.csproj `
            -p:TargetFrameworks=net10.0 `
            --framework net10.0 `
            --configuration Release `
            --filter $filter `
            --logger trx `
            --results-directory $results
          $testExitCode = $LASTEXITCODE

          $trx = @(Get-ChildItem $results -Recurse -Filter *.trx | ForEach-Object FullName)
          ./scripts/Test-TestRunResults.ps1 -Path $trx -MinimumPassed 2500
          exit $testExitCode

      - name: Archive portable test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-linux-${{ github.run_number }}
          path: artifacts/TestResults/portable-linux/**
          if-no-files-found: warn
          retention-days: 30

  # MOBAdemo web demo (issue #430, FR-053, FR-074, FR-076, SC-010): the frontend lint, unit tests and production build
  # (the same MOBAdemo/build.ps1 the deployment uses), the dependency audit and the Brotli budget of the scripts and
  # style sheets, plus the MOBAdemo host and build-script tests. It needs Node and the .NET SDK only; no WinUI or
  # Android workload. The audit reads the committed lockfile before any dependency is installed, so no package code
  # has run when it decides.
  mobademo:
    name: MOBAdemo frontend, audit and bundle budget
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobademo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: MOBAdemo/app/.nvmrc
          cache: npm
          cache-dependency-path: MOBAdemo/app/package-lock.json

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # FR-074: fail on known high or critical vulnerabilities, development dependencies included because they
      # build what ships. Only the lockfile is audited (no install yet). A registry or transport error is retried
      # once and then fails: only a valid report counts. A new advisory turns this red on the next run that
      # starts the job, with or without a change to the lockfile.
      - name: Audit npm dependencies
        shell: pwsh
        working-directory: MOBAdemo/app
        run: |
          $report = $null
          $severities = 'critical', 'high', 'moderate', 'low', 'info'
          foreach ($attempt in 1..2) {
            $raw = npm audit --package-lock-only --include=prod --include=dev --audit-level=high --registry https://registry.npmjs.org/ --json 2>$null | Out-String
            try { $candidate = $raw | ConvertFrom-Json } catch { $candidate = $null }
            # A valid report has the v2 format, no error object and a non-negative integer count per severity.
            $valid = $null -ne $candidate -and
              $null -eq $candidate.PSObject.Properties['error'] -and
              $candidate.PSObject.Properties['auditReportVersion'] -and $candidate.auditReportVersion -eq 2 -and
              $candidate.PSObject.Properties['metadata'] -and $candidate.metadata.PSObject.Properties['vulnerabilities'] -and
              $candidate.PSObject.Properties['vulnerabilities']
            if ($valid) {
              foreach ($severity in $severities) {
                $count = $candidate.metadata.vulnerabilities.PSObject.Properties[$severity]
                if ($null -eq $count -or (($count.Value -isnot [int]) -and ($count.Value -isnot [long])) -or $count.Value -lt 0) { $valid = $false }
              }
            }
            if ($valid) {
              # The counts must match the findings: an empty or inconsistent report is not accepted.
              $entries = @($candidate.vulnerabilities.PSObject.Properties)
              foreach ($severity in $severities) {
                $listed = @($entries | Where-Object { $_.Value.severity -eq $severity }).Count
                if ($listed -ne $candidate.metadata.vulnerabilities.PSObject.Properties[$severity].Value) { $valid = $false }
              }
            }
            if ($valid) {
              $report = $candidate
              break
            }
            Write-Host "Attempt ${attempt}: no valid audit report."
            if ($attempt -lt 2) { Start-Sleep -Seconds 10 }
          }
          if ($null -eq $report) {
            Write-Host '::error title=npm audit::No valid audit report; the registry or the audit endpoint did not answer.'
            exit 1
          }
          $counts = $report.metadata.vulnerabilities
          Write-Host "Vulnerabilities: critical=$($counts.critical) high=$($counts.high) moderate=$($counts.moderate) low=$($counts.low) info=$($counts.info)"
          $blocking = @($report.vulnerabilities.PSObject.Properties | Where-Object { $_.Value.severity -in 'high', 'critical' })
          foreach ($entry in $blocking) { Write-Host "  $($entry.Value.severity): $($entry.Name)" }
          if (([int] $counts.critical + [int] $counts.high) -gt 0) {
            Write-Host '::error title=npm audit::Known high or critical vulnerabilities in the lockfile (FR-074).'
            exit 1
          }
          # npm exits non-zero for findings below the threshold too; an accepted report must not fail the step.
          exit 0

      - name: Test bundle budget script
        shell: pwsh
        run: ./MOBAdemo/Test-BundleBudget.Tests.ps1

      - name: Install frontend dependencies
        working-directory: MOBAdemo/app
        run: npm ci --ignore-scripts

      - name: Lint frontend
        working-directory: MOBAdemo/app
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: MOBAdemo/app
        run: npm test

      # Runs `npm ci`, `tsc --noEmit`, the Vite production build and the Brotli and gzip precompression, and
      # writes the web root of the host to MOBAdemo/Host/wwwroot-build.
      - name: Build the MOBAdemo web root
        shell: pwsh
        run: ./MOBAdemo/build.ps1

      # FR-076: scripts and style sheets together at most 200 KB with Brotli.
      - name: Check the bundle budget
        shell: pwsh
        run: ./MOBAdemo/Test-BundleBudget.ps1 -Path MOBAdemo/Host/wwwroot-build

      # Builds the host through the test project reference (the .NET build of this job) and runs the host and
      # build-script tests. The guard fails when fewer tests than expected ran or any selected test did not run.
      - name: Run MOBAdemo .NET tests
        shell: pwsh
        run: |
          $results = 'artifacts/TestResults/mobademo'
          dotnet test Test/Test.csproj `
            -p:TargetFrameworks=net10.0 `
            --framework net10.0 `
            --configuration Release `
            --filter 'FullyQualifiedName~Moba.Test.MOBAdemo' `
            --logger trx `
            --results-directory $results
          $testExitCode = $LASTEXITCODE

          $trx = @(Get-ChildItem $results -Recurse -Filter *.trx | ForEach-Object FullName)
          ./scripts/Test-TestRunResults.ps1 -Path $trx -MinimumPassed 150
          exit $testExitCode

      - name: Build MOBAdemo host
        shell: pwsh
        run: dotnet build MOBAdemo/Host/MOBAdemo.csproj --configuration Release

      - name: Install Playwright Chromium
        working-directory: MOBAdemo/app
        run: npx --no-install playwright install --with-deps chromium

      - name: Run MOBAdemo browser checks
        working-directory: MOBAdemo/app
        run: npm run e2e

      - name: Archive MOBAdemo test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobademo-${{ github.run_number }}
          path: artifacts/TestResults/mobademo/**
          if-no-files-found: warn
          retention-days: 30

      - name: Archive MOBAdemo browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobademo-playwright-${{ github.run_number }}
          path: |
            MOBAdemo/app/playwright-report/**
            MOBAdemo/app/test-results/**
          if-no-files-found: ignore
          retention-days: 30

  android-release:
    name: Android Release AAB
    needs: changes
    # Pushes to main and pull requests run this job when they change MOBAsmart/ or
    # quality/analyzer-baseline.android.json (maintainer decision of 2026-11-08, issue #360, extended to main pushes
    # on 2026-11-27); scripts/Get-QualityChangeScope.ps1 owns the path rule. Like the other scoped jobs it fails open:
    # a failed change detection leaves the output empty and runs it. Manual validation exercises the pinned toolchain
    # without publishing a release.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.validate_android) ||
        ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.android != 'false')) }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An SDK in Program Files also installs every workload registered by the image's Visual Studio.
      - name: Use a job-local .NET install
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuget/packages
          key: >-
            nuget-${{ runner.os }}-android-${{ hashFiles('global.json', 'NuGet.Config',
            'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-android-

      # Install and verify the agreed set; --skip-manifest-update alone does not pin workloads.
      - name: Install pinned MAUI Android workload
        shell: pwsh
        run: |
          $expectedWorkloadVersion = '10.0.402'
          dotnet workload install maui-android --version $expectedWorkloadVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualWorkloadVersion = dotnet workload --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualWorkloadVersion.Trim() -ne $expectedWorkloadVersion) {
            throw "Expected workload set $expectedWorkloadVersion; found $actualWorkloadVersion."
          }
          dotnet --info

      - name: Restore Android dependency graph
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts/analyzers) {
            Remove-Item -LiteralPath artifacts/analyzers -Recurse -Force
          }
          dotnet restore MOBAsmart/MOBAsmart.csproj `
            --property:Configuration=Release `
            --force-evaluate

      - name: Verify Android build properties
        shell: pwsh
        run: |
          $properties = dotnet msbuild MOBAsmart/MOBAsmart.csproj `
            -nologo `
            -p:Configuration=Release `
            -getProperty:Platform,PlatformTarget,RuntimeIdentifiers,AndroidPackageFormats |
            ConvertFrom-Json
          if ($properties.Properties.Platform -ne 'AnyCPU') {
            throw "Expected Platform=AnyCPU; found $($properties.Properties.Platform)."
          }
          if ($properties.Properties.PlatformTarget -ne 'AnyCPU') {
            throw "Expected PlatformTarget=AnyCPU; found $($properties.Properties.PlatformTarget)."
          }
          if ($properties.Properties.RuntimeIdentifiers -ne 'android-arm64;android-x64') {
            throw "Unexpected Android RuntimeIdentifiers: $($properties.Properties.RuntimeIdentifiers)"
          }
          if ($properties.Properties.AndroidPackageFormats -ne 'aab') {
            throw "Expected AndroidPackageFormats=aab; found $($properties.Properties.AndroidPackageFormats)."
          }

      - name: Publish Android Release AAB
        shell: pwsh
        run: >-
          dotnet publish MOBAsmart/MOBAsmart.csproj
          --framework net10.0-android
          --configuration Release
          --no-restore
          -m:1
          -p:MobaAnalyzerGate=true
          -p:UseSharedCompilation=false

      - name: Enforce Android analyzer baseline
        shell: pwsh
        run: >-
          ./scripts/Test-AnalyzerBaseline.ps1
          -SarifRoot artifacts/analyzers/Release
          -BaselinePath quality/analyzer-baseline.android.json
          -RefreshedBaselinePath artifacts/refreshed-baselines/analyzer-baseline.android.json

      # Written only when the sole mismatch is fixed diagnostics; copy it over the file in quality/ after review.
      - name: Archive refreshed analyzer baselines
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-analyzer-baselines-android-${{ github.run_number }}
          path: artifacts/refreshed-baselines/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate Android Release AAB
        shell: pwsh
        run: |
          $bundleRoot = 'MOBAsmart/bin/Release/net10.0-android/publish'
          $bundles = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter *.aab)
          if ($bundles.Count -eq 0) {
            throw 'Android Release publish did not produce an AAB.'
          }
          $apks = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter *.apk)
          if ($apks.Count -ne 0) {
            throw "Android Release publish produced unexpected APK files: $($apks.Name -join ', ')"
          }
          New-Item -ItemType Directory -Force artifacts/MOBAsmart-Release | Out-Null
          foreach ($bundle in $bundles) {
            ./scripts/Test-AndroidAppBundle.ps1 -BundlePath $bundle.FullName
            Copy-Item -LiteralPath $bundle.FullName -Destination artifacts/MOBAsmart-Release
          }

      - name: Archive Android Release AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MOBAsmart-android-release-${{ github.run_number }}
          path: artifacts/MOBAsmart-Release/*.aab
          if-no-files-found: error
          retention-days: 30

  mutation-domain:
    name: Domain mutation testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mutation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools and Domain mutation test graph
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MutationTest/Domain.MutationTests.csproj

      - name: Run Domain mutation tests
        shell: pwsh
        run: ./scripts/Invoke-MutationLane.ps1 -LaneName domain -OutputPath artifacts/mutation/domain

      - name: Archive Domain mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-mutation-${{ github.run_number }}
          path: artifacts/mutation/domain/**
          if-no-files-found: warn
          retention-days: 90
