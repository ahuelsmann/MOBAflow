name: Report a bug
description: Report a reproducible problem in MOBAflow or a related application.
title: "[Bug]: "
labels: ["product"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include credentials, private keys, or complete private network configurations.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Where does the problem occur?
      options:
        - MOBAflow (Windows)
        - MOBAsmart (Android)
        - MOBApi
        - MOBAdisplay
        - Track plan
        - Z21 communication
        - Documentation or infrastructure
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit you tested.
      placeholder: "For example, 0.2.0 or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, .NET version, and device where applicable.
      placeholder: "For example, Windows 11 24H2, .NET 10; Android 16"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What happened?
      placeholder: Describe the problem as precisely as possible.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Which steps reliably reproduce the problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and additional information
      description: Add relevant sanitized logs, screenshots, or other context.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing issues describing the same problem.
          required: true
        - label: I removed credentials, private keys, and unnecessary private network data.
          required: true
        - label: For hardware-related problems, I put the railroad layout into a safe state.
          required: true
