name: Suggest a feature
description: Suggest an improvement for model railroad operation or development.
title: "[Feature]: "
labels: ["product"]
body:
  - type: markdown
    attributes:
      value: |
        Good proposals begin with the problem they solve for model railroad operators or contributors.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - MOBAflow
        - MOBAsmart
        - MOBApi
        - MOBAdisplay
        - Track plan
        - Z21
        - Documentation
        - Infrastructure
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current situation
      description: What concrete problem or need exists today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should MOBAflow behave from the user's perspective?
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Benefit to model railroad operation
      description: Who benefits, and in which operating situation?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which other solutions or workflows have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, examples, or links that clarify the proposal.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing issues containing the same proposal.
          required: true
        - label: The proposal describes an outcome without prescribing a mandatory technical implementation.
          required: true
