name: Funktion vorschlagen
description: Schlage eine Verbesserung für den Modellbahnbetrieb oder die Entwicklung vor.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Gute Vorschläge beginnen mit dem Problem, das sie für Modellbahner oder Mitwirkende lösen.

  - type: dropdown
    id: area
    attributes:
      label: Produktbereich
      options:
        - MOBAflow
        - MOBAsmart
        - MOBApi
        - MOBAdisplay
        - Gleisplan
        - Z21
        - Dokumentation
        - Infrastruktur
        - Bereichsübergreifend
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Ausgangssituation
      description: Welches konkrete Problem oder Bedürfnis besteht heute?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Vorgeschlagene Lösung
      description: Wie sollte sich MOBAflow aus Sicht des Nutzers verhalten?
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Nutzen für den Modellbahnbetrieb
      description: Wer profitiert davon und in welcher Betriebssituation?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Welche anderen Lösungen oder Arbeitsabläufe hast du erwogen?

  - type: textarea
    id: context
    attributes:
      label: Zusätzlicher Kontext
      description: Skizzen, Beispiele oder Links, die den Vorschlag verständlicher machen.

  - type: checkboxes
    id: checks
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe nach bestehenden Issues mit demselben Vorschlag gesucht.
          required: true
        - label: Der Vorschlag beschreibt ein Ziel und schreibt keine bestimmte technische Umsetzung zwingend vor.
          required: true
