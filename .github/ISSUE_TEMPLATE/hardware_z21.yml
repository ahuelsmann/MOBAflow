name: Hardware or Z21 problem
description: Report problems involving Z21, feedback modules, turnouts, networking, or physical layout hardware.
title: "[Hardware/Z21]: "
labels: ["product"]
body:
  - type: markdown
    attributes:
      value: |
        **Safety first:** Stop all trains and disconnect track power before further testing if behavior becomes uncontrolled.
        Do not disclose Wi-Fi passwords, credentials, or complete private network configurations.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Z21 connection
        - Locomotive control or functions
        - Turnout or signal
        - Feedback module
        - MOBAsmart connection
        - MOBAdisplay or ESP32
        - Network or discovery
        - Other hardware
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware and firmware
      description: Provide the model, firmware, and relevant interfaces.
      placeholder: "For example, black Z21, firmware 1.xx, R-BUS"
    validations:
      required: true

  - type: input
    id: software
    attributes:
      label: MOBAflow version and environment
      placeholder: "For example, 0.2.0, Windows 11; MOBAsmart on Android 16"
    validations:
      required: true

  - type: textarea
    id: topology
    attributes:
      label: Layout and network topology
      description: Describe only the connections needed to understand the problem. Redact IP addresses where appropriate.
      placeholder: "PC and Z21 connected by LAN to the same router; smartphone on the local Wi-Fi network"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: What happens in the software and on the physical layout?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put the layout into a safe initial state
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information
      description: Add sanitized logs, Z21 packets, screenshots, or status displays.
      render: shell

  - type: dropdown
    id: spec_kit
    attributes:
      label: Spec Kit workflow
      description: Classify the specification work required before implementation.
      options:
        - Required before implementation
        - Existing Spec Kit feature
        - Not applicable - hardware triage only
    validations:
      required: true

  - type: input
    id: spec_kit_reference
    attributes:
      label: Spec Kit reference
      description: For an existing feature, provide its specs/NNN-feature-name path or linked issue.
      placeholder: "For example, specs/001-safe-routing or #123"

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: The layout is in a safe state and cannot perform uncontrolled movement.
          required: true
        - label: I removed credentials and unnecessary private network data.
          required: true
        - label: I read the hardware and safety guidance.
          required: true
